name: ProfTogo - publication Web prioritaire et APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proftogo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Construire et publier le site Web
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les plateformes
        run: flutter create --platforms=web,android --org tg.proftogo .

      - name: Installer les dépendances
        run: flutter pub get

      - name: Tester l’intégrité des données pédagogiques
        run: flutter test

      - name: Vérifier le projet
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Construire le site Web
        run: flutter build web --release --base-href "/elawseducation-/"

      - name: Ajouter la console d’administration séparée
        run: mkdir -p build/web/admin && cp admin/index.html build/web/admin/index.html

      - name: Préparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    name: Publier immédiatement le site Web
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier ProfTogo
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    if: ${{ true }} # Construction Android activée après validation Web et tests
    name: Construire et publier l’APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les plateformes
        run: flutter create --platforms=web,android --org tg.proftogo .
      - name: Configurer Firebase pour Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = next((p for p in (Path("android/settings.gradle.kts"), Path("android/settings.gradle")) if p.exists()), None)
          app = next((p for p in (Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")) if p.exists()), None)
          config = Path("android/app/google-services.json")

          if settings is None or app is None:
              raise SystemExit("Fichiers Gradle Android introuvables")
          if not config.exists():
              raise SystemExit("Le fichier android/app/google-services.json est introuvable")

          settings_text = settings.read_text(encoding="utf-8")
          if "com.google.gms.google-services" not in settings_text:
              line = '    id("com.google.gms.google-services") version "4.4.4" apply false' if settings.suffix == ".kts" else "    id 'com.google.gms.google-services' version '4.4.4' apply false"
              if "plugins {" not in settings_text:
                  raise SystemExit("Bloc plugins introuvable dans settings Gradle")
              settings_text = settings_text.replace("plugins {", "plugins {" + chr(10) + line, 1)
              settings.write_text(settings_text, encoding="utf-8")

          app_text = app.read_text(encoding="utf-8")
          if "com.google.gms.google-services" not in app_text:
              line = '    id("com.google.gms.google-services")' if app.suffix == ".kts" else "    id 'com.google.gms.google-services'"
              if "plugins {" not in app_text:
                  raise SystemExit("Bloc plugins introuvable dans build.gradle Android")
              app_text = app_text.replace("plugins {", "plugins {" + chr(10) + line, 1)
              app.write_text(app_text, encoding="utf-8")
          PY


      - name: Configurer les dépôts Gradle Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/settings.gradle.kts")
          if not path.exists():
              path = Path("android/settings.gradle")
          text = path.read_text(encoding="utf-8")
          match = re.search(r"pluginManagement\s*\{[\s\S]*?repositories\s*\{([\s\S]*?)\}", text)
          if not match:
              raise SystemExit("Bloc pluginManagement.repositories introuvable")
          block = match.group(1)
          additions = []
          if not re.search(r"mavenCentral\s*\(", block):
              additions.append("        mavenCentral()")
          if not re.search(r"google\s*\(", block):
              additions.append("        google()")
          if additions:
              updated = block.rstrip() + "\n" + "\n".join(additions) + "\n      "
              text = text[:match.start(1)] + updated + text[match.end(1):]
              path.write_text(text, encoding="utf-8")
          print("Dépôts Gradle vérifiés : Google, Maven Central et Plugin Portal.")
          PY

      - name: Installer l’icône ProfTogo sur Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("android/app/src/main/res/drawable")
          res.mkdir(parents=True, exist_ok=True)
          icon = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#087443" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M8,8h92v92h-92z"/>
              <path android:fillColor="#102C55" android:pathData="M54,15L17,34L54,52L91,34z"/>
              <path android:fillColor="#1D477B" android:pathData="M28,36v13c15,12 37,12 52,0V36L54,49z"/>
              <path android:fillColor="#F6C928" android:pathData="M54,20l3,7 8,1-6,5 2,8-7,-4-7,4 2,-8-6,-5 8,-1z"/>
              <path android:fillColor="#079447" android:pathData="M54,44a5,5 0,1 0,0 10a5,5 0,1 0,0 -10 M54,55l-13,14 13,-5 13,5z"/>
              <path android:fillColor="#CDE8FF" android:pathData="M12,68Q31,58 54,71Q77,58 96,68v24Q76,83 54,96Q32,83 12,92z"/>
              <path android:fillColor="#1672C5" android:pathData="M12,68Q31,58 54,71Q77,58 96,68v4Q76,64 54,77Q32,64 12,72z"/>
              <path android:fillColor="#075B38" android:pathData="M16,96h76v8h-76z"/>
            </vector>"""
          (res / "proftogo_launcher.xml").write_text(icon, encoding="utf-8")
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")
          xml, count = re.subn(r'android:icon="[^"]+"',
                               'android:icon="@drawable/proftogo_launcher"', xml, count=1)
          if count != 1:
              raise SystemExit("Impossible de configurer l’icône Android")
          if "android:roundIcon=" not in xml:
              xml = xml.replace("<application", '<application android:roundIcon="@drawable/proftogo_launcher"', 1)
          else:
              xml = re.sub(r'android:roundIcon="[^"]+"',
                           'android:roundIcon="@drawable/proftogo_launcher"', xml, count=1)
          # Nom exact affiché sous l’icône sur le téléphone.
          if 'android:label=' in xml:
              xml = re.sub('android:label="[^"]*"', 'android:label="PROFTOGO"', xml, count=1)
          else:
              xml = xml.replace("<application", '<application android:label="PROFTOGO"', 1)
          manifest.write_text(xml, encoding="utf-8")
          PY

      - name: Autoriser les services vocaux Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")

          for permission in (
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
          ):
              if permission not in xml:
                  xml = xml.replace(
                      "<application",
                      f'    <uses-permission android:name="{permission}" />\n    <application',
                      1,
                  )

          tts_query = """
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
          """
          speech_query = """
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
          """

          if "<queries>" not in xml:
              xml = xml.replace(
                  "<application",
                  "    <queries>\n" + tts_query + speech_query + "    </queries>\n    <application",
                  1,
              )
          else:
              if "android.intent.action.TTS_SERVICE" not in xml:
                  xml = xml.replace("</queries>", tts_query + "    </queries>", 1)
              if "android.speech.RecognitionService" not in xml:
                  xml = xml.replace("</queries>", speech_query + "    </queries>", 1)

          manifest.write_text(xml, encoding="utf-8")
          PY

      - name: Installer les dépendances
        run: flutter pub get

      - name: Tester l’intégrité des données pédagogiques
        run: flutter test

      - name: Vérifier le projet
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Construire l’APK Android
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PROFTOGO.apk

      - name: Conserver l’APK
        uses: actions/upload-artifact@v4
        with:
          name: PROFTOGO-APK-Android
          path: build/app/outputs/flutter-apk/PROFTOGO.apk
          if-no-files-found: error

      - name: Publier la version Android
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proftogo-build-${{ github.run_number }}
          name: PROFTOGO - APK ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/PROFTOGO.apk
          generate_release_notes: true
