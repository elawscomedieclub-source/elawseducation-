name: ProfTogo - publication Web et APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proftogo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les plateformes Web et Android
        run: flutter create --platforms=web,android --org tg.proftogo .

      - name: Autoriser le service vocal Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")
          if "android.intent.action.TTS_SERVICE" not in xml:
              query = """
              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
          """
              xml = re.sub(r"(<manifest\\b[^>]*>)", r"\\1" + query, xml, count=1)
              manifest.write_text(xml, encoding="utf-8")
          PY

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le projet
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Construire le site Web
        run: flutter build web --release --base-href "/elawseducation-/"

      - name: Construire l'APK Android
        run: flutter build apk --release

      - name: Préparer GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Conserver l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfTogo-APK-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publier la version Android
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proftogo-build-${{ github.run_number }}
          name: ProfTogo - APK ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
