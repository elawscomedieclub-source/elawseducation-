name: ProfTogo - publication Web prioritaire et APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: proftogo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Construire et publier le site Web
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les plateformes
        run: flutter create --platforms=web,android --org tg.proftogo .

      - name: Installer les dépendances
        run: flutter pub get

      - name: Tester l’intégrité des données pédagogiques
        run: flutter test

      - name: Vérifier le projet
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Construire le site Web
        run: flutter build web --release --base-href "/elawseducation-/"

      - name: Préparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    name: Publier immédiatement le site Web
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier ProfTogo
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Construire et publier l’APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer les plateformes
        run: flutter create --platforms=web,android --org tg.proftogo .

      - name: Autoriser les services vocaux Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")

          for permission in (
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
          ):
              if permission not in xml:
                  xml = xml.replace(
                      "<application",
                      f'    <uses-permission android:name="{permission}" />\n    <application',
                      1,
                  )

          tts_query = """
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
          """
          speech_query = """
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
          """

          if "<queries>" not in xml:
              xml = xml.replace(
                  "<application",
                  "    <queries>\n" + tts_query + speech_query + "    </queries>\n    <application",
                  1,
              )
          else:
              if "android.intent.action.TTS_SERVICE" not in xml:
                  xml = xml.replace("</queries>", tts_query + "    </queries>", 1)
              if "android.speech.RecognitionService" not in xml:
                  xml = xml.replace("</queries>", speech_query + "    </queries>", 1)

          manifest.write_text(xml, encoding="utf-8")
          PY

      - name: Installer les dépendances
        run: flutter pub get

      - name: Tester l’intégrité des données pédagogiques
        run: flutter test

      - name: Vérifier le projet
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Construire l’APK Android
        run: flutter build apk --release

      - name: Conserver l’APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfTogo-APK-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publier la version Android
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proftogo-build-${{ github.run_number }}
          name: ProfTogo - APK ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
