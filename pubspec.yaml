name: proftogo
description: Application éducative pour les élèves au Togo - cours, exercices, évaluations, accompagnement APC et suivi de progression.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  phosphor_icons: ^3.0.1
  flutter_svg: ^2.0.10+1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.4.2
  http: ^1.2.2
  firebase_core: ^4.15.2
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.2
  cloud_functions: ^6.0.5
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
