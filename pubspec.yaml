name: proftogo
description: Application éducative officielle pour les élèves togolais (6ème à Terminale) - Cours, exercices, mode vocal et suivi de progression.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # State & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Storage & Data
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.4.2

  # Voice (placeholder - replace with real STT/TTS later)
  # speech_to_text: ^6.6.2
  # flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/

  # fonts:
  #   - family: Inter
